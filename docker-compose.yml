services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: forest-fire-backend
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: forest-fire-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend